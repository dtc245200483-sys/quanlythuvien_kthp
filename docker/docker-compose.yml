name: app

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: library_ai_backend
    restart: unless-stopped
    depends_on:
      - sqlserver
    env_file:
      - path: ../chatbotAI/.env
        required: false
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:Password123!@sqlserver:1433/LibraryDB?driver=ODBC+Driver+17+for+SQL+Server&TrustServerCertificate=yes
    ports:
      - "8000:8000"
    volumes:
      - ../frontend:/app/frontend
      - ../Backend:/app/Backend
      - ../chatbotAI:/app/chatbotAI
      # Named volume cho vector_db đè lên để đảm bảo I/O nhanh và không lỗi SQLite trên Windows
      - chroma_data:/app/chatbotAI/vector_db

volumes:
  mssql_data:
  chroma_data:
