<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mượn / Trả sách — Thư viện ICTU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260810-12">
</head>
<body data-page="borrow">
  <header class="app-header" id="app-header-root"></header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>

    <div id="loading" class="loading" hidden>
      <span class="spinner"></span>
      <span>Đang tải dữ liệu...</span>
    </div>

    <div class="card">
      <h2>Lập phiếu mượn</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="borrow-ma-phieu">Mã phiếu mượn</label>
          <input type="text" id="borrow-ma-phieu" maxlength="20" placeholder="VD: PM001" required>
        </div>
        <div class="form-group">
          <label for="borrow-reader">Độc giả</label>
          <select id="borrow-reader" required>
            <option value="">— Chọn độc giả —</option>
          </select>
        </div>
        <div class="form-group">
          <label for="borrow-so-ngay">Số ngày mượn (hạn trả)</label>
          <input type="number" id="borrow-so-ngay" min="1" max="365" value="14" required>
        </div>
      </div>

      <h3>Sách mượn</h3>
      <div id="borrow-items"></div>
      <div class="modal-actions">
        <button type="button" id="add-borrow-item" class="btn btn-secondary">+ Thêm sách</button>
        <button type="button" id="create-borrow-button" class="btn btn-primary">Lập phiếu mượn</button>
      </div>
    </div>

    <div class="card">
      <h2>Phiếu đang mượn</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã phiếu</th>
              <th>Độc giả</th>
              <th>Ngày mượn</th>
              <th>Hạn trả</th>
              <th>Gia hạn</th>
              <th>Chi tiết</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="active-borrow-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Thu phạt</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã phiếu</th>
              <th>Độc giả</th>
              <th>Số ngày quá hạn</th>
              <th>Mức phạt</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="fine-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260810-8"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/layout.js?v=20260916-01"></script>
  <script>window.Layout.init("borrow");</script>
  <script src="js/borrow.js?v=20260810-2"></script>
</body>
</html>
