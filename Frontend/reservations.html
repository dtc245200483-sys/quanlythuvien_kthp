<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt trước sách — Thư viện ICTU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260810-12">
</head>
<body data-page="reservations">
  <header class="app-header" id="app-header-root"></header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>
    <div id="loading" class="loading" hidden>
      <span class="spinner"></span>
      <span>Đang tải dữ liệu...</span>
    </div>

    <section class="card" data-roles="reader" hidden>
      <h2>Đặt trước của tôi</h2>
      <div class="toolbar">
        <button type="button" id="delete-processed-reservations-button" class="btn btn-danger" hidden>Xoá lịch sử đã xử lý</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã đặt</th>
              <th>Tên sách</th>
              <th>Ngày đặt</th>
              <th>Hạn nhận sách</th>
              <th>Trạng thái</th>
              <th>Vị trí</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="reader-reservation-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="card" data-roles="librarian" hidden>
      <h2>Danh sách đặt trước (xử lý)</h2>
      <div class="toolbar">
        <button type="button" id="delete-processed-librarian-button" class="btn btn-danger" hidden>Xoá lịch sử đã xử lý</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã đặt</th>
              <th>Mã sách</th>
              <th>Tên sách</th>
              <th>Độc giả</th>
              <th>Ngày đặt</th>
              <th>Hạn nhận sách</th>
              <th>Trạng thái</th>
              <th>Vị trí</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="librarian-reservation-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260810-9"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/layout.js?v=20260916-01"></script>
  <script>window.Layout.init("reservations");</script>
  <script src="js/notifications-core.js?v=20260810-5"></script>
  <script src="js/notif-badge.js?v=20260809-7"></script>
  <script src="js/reservations.js?v=20261028-01"></script>
</body>
</html>
